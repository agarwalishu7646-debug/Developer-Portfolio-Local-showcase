<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Project</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            padding: 25px 15px;
        }

        .container {
            max-width: 550px;
            margin: 40px auto;
            padding: 30px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 15px;
            animation: appear 0.6s ease;
        }

        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 7px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 16px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button,
        .back {
            display: inline-block;
            padding: 12px 18px;
            margin-top: 22px;
            border: none;
            border-radius: 7px;
            background: #0284c7;
            color: white;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover,
        .back:hover {
            background: #38bdf8;
            color: #0f172a;
        }

        .back {
            margin-left: 8px;
            background: #475569;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Edit Project</h1>

        <form action="/edit-project/{{ project_id }}" method="POST">

            <label for="name">Project Name</label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ project.name }}"
                required
            >

            <label for="description">Project Description</label>

            <textarea
                id="description"
                name="description"
                required
            >{{ project.description }}</textarea>

            <label for="technology">Technologies Used</label>

            <input
                type="text"
                id="technology"
                name="technology"
                value="{{ project.technology }}"
                required
            >

            <button type="submit">Save Changes</button>

            <a href="/" class="back">Cancel</a>

        </form>

    </div>

</body>
</html>
